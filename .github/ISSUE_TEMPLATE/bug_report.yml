name: Bug report
description: Something in DropX does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The request you sent. A curl command is best. Remove API keys and tokens.
      render: bash
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Status code, headers and body you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened, with a link to the docs if they describe it.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - https://dropx.click
        - Self-hosted deployment
        - Local wrangler dev
    validations:
      required: true
