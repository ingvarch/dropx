[package]
name = "dropx"
version = "0.3.0"
edition = "2021"
authors = ["Igor Churmeev <ingvarch@gmail.com>"]
description = "Fast and secure temporary file sharing service built on Cloudflare Workers with R2 storage, D1 database, and rate limiting"
repository = "https://github.com/ingvarch/dropx"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base58 = "0.2"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "js"] }
sha2 = "0.11"
hex = "0.4"
subtle = { version = "2.6", default-features = false }
hmac = "0.13"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Workaround: strip = true drops the target_features section and wasm-bindgen >= 0.2.125
# fails with "externref table required". Revert once wasm-bindgen#5205 ships.
# https://github.com/cloudflare/workers-rs/issues/1014
strip = "debuginfo"
